{% extends 'hospApp/home.html' %}
{% load static %}

{% block content %}

<div class="container-fluid">
  <div class="card form-card">


<!-- Header -->
<div class="form-header py-2">
  <h6>Payment Mode Report</h6>
</div>

<!-- Body -->
<div class="card-body">

  <form method="get"
        action="{% url 'paymentmode_collection_report' %}"
        id="userwiseForm"
        class="row g-2 mb-3">

    {% csrf_token %}

    <fieldset class="custom-fieldset mb-3">
      <legend class="custom-legend mb-4">
        <span class="legend-text">Payment Mode Report</span>
      </legend>
      <div class="row mt-3">
        <div class="col-md-12">
         

          <div class="d-flex flex-wrap gap-3 mt-2">

            <!-- Default -->
           

            <!-- Dynamic list -->
            {% for i in list %}
<div class="form-check">
  <input class="form-check-input"
         type="radio"
         name="payment_mode"
         value="{{ i.name }}"
         {% if forloop.first %}checked{% endif %}>
  <label class="form-check-label">{{ i.name }}</label>
</div>
{% endfor %}

          </div>
        </div>
      </div>

      <!-- Dates -->
      <div class="row mt-4">
        <div class="col-md-4">
          <div class="d-flex align-items-center">
            <label class="form-label rpt-label">From Date</label>
            <input type="datetime-local"
                   name="from_date"
                   id="from_date"
                   class="form-control"
                   required
                   onblur="validateDate(this)">
          </div>
        </div>

        <div class="col-md-4">
          <div class="d-flex align-items-center">
            <label class="form-label rpt-label">To Date</label>
            <input type="datetime-local"
                   name="to_date"
                   id="to_date"
                   class="form-control"
                   required
                   onblur="validateDate(this)">
          </div>
        </div>
      </div>

      <!-- Payment Mode -->
      

      <!-- Buttons -->
      <div class="row align-items-center mt-4">
        <div class="col-md-3"></div>

        <div class="col-md-4 text-center">
          <button type="submit" class="btn btn-success btn-sm">📊 Submit</button>
          <button type="button" class="btn btn-secondary btn-sm" id="cancelBtn">Clear</button>
        </div>
      </div>

    </fieldset>

  </form>

</div>


  </div>
</div>

<!-- Styles -->

<style>
.custom-fieldset {
  border: 1px solid #9ca3af;
  border-radius: .5rem;
  padding: .45rem 1rem 1rem;
}

.custom-legend {
  font-size: .9rem;
  font-weight: 700;
  padding: 0 .5rem;
  color: green;
}

.legend-text {
  font-size: .8rem;
  font-weight: 700;
  display: inline-block;
  border-bottom: 2px solid #111827;
  line-height: 1.2;
}
</style>

<!-- Form Submit -->

<script>
document.getElementById("userwiseForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const from = new Date(document.getElementById("from_date").value);
    const to = new Date(document.getElementById("to_date").value);

    if (from > to) {
        alert("From DateTime cannot be greater than To DateTime");
        return;
    }

    const form = e.target;
    const params = new URLSearchParams(new FormData(form)).toString();
    const url = form.action + "?" + params;

    window.open(
        url,
        "ReceiptWindow",
        "width=950,height=650,left=200,top=100," +
        "menubar=no,toolbar=no,location=no,status=no," +
        "scrollbars=yes,resizable=yes"
    );
});
</script>

<!-- Default Date Setup -->

<script>
document.addEventListener("DOMContentLoaded", function () {
    const now = new Date();

    const pad = (n) => n.toString().padStart(2, "0");

    const todayDate =
        now.getFullYear() + "-" +
        pad(now.getMonth() + 1) + "-" +
        pad(now.getDate());

    const currentTime =
        pad(now.getHours()) + ":" +
        pad(now.getMinutes());

    const fromDateTime = todayDate + "T00:00";
    const toDateTime = todayDate + "T" + currentTime;

    const fromDate = document.getElementById("from_date");
    const toDate = document.getElementById("to_date");

    fromDate.value = fromDateTime;
    toDate.value = toDateTime;

    const maxDateTime = todayDate + "T" + currentTime;
    fromDate.max = maxDateTime;
    toDate.max = maxDateTime;
});

function validateDate(input) {
    const now = new Date();
    const selected = new Date(input.value);

    if (!input.value) {
        alert("Invalid date.");
        return;
    }

    if (selected > now) {
        alert("Future date/time not allowed");

        const pad = (n) => n.toString().padStart(2, "0");

        const correctValue =
            now.getFullYear() + "-" +
            pad(now.getMonth() + 1) + "-" +
            pad(now.getDate()) + "T" +
            pad(now.getHours()) + ":" +
            pad(now.getMinutes());

        input.value = correctValue;
    }
}
</script>

{% endblock %}
