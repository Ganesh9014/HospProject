<style>
    /* 1. Make the body fill the entire viewport */
    body {
        display: flex; /* Activate Flexbox */

<!DOCTYPE html>
<html>
<head>
    

        /* 4. Input Field Styling */
        .input-group {
            margin-bottom: 20px;
            text-align: left; /* Align labels to the left */
        }
        
        .input-group label {
            display: block; /* Make label take up full width */
            margin-bottom: 5px;
            font-weight: bold;
            font stle: italic;
            color: #4a4a4a;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box; /* Crucial for padding/border not to increase width */
            font-size: 16px;
            font stle: italic;
        }
        
        /* 5. Submit Button Styling */
        .login-container button {
            width: 100%;
            background-color: #007bff; /* Primary blue color */
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
	    font stle: italic;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .login-container button:hover {
            background-color: #0056b3; /* Darker blue on hover */
        }
    </style>
</head>
<body>
    
    <div class="login-container"> 
        <h1>Log In</h1>
        
        <form action="/validate_login" method="POST">
            
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            
            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
