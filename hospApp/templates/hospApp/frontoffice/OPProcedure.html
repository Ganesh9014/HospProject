{% extends 'hospApp/home.html' %}
{% load static %}
{% block content %}

<div class="container-fluid">
  <div class="card form-card">
    <div class="form-header py-2">
      <h6 class="mb-0">OP-Procedure</h6>
    </div>

    <div class="card-body">
      <form method="post" id="procedureForm" action="{% url 'save_procedure' %}" data-due-field="#due"
      data-reason-field="#reason" autocomplete="off">
        {% csrf_token %}

        <!-- ================= Row 1 ================= -->
        <div class="row mb-2">
          <div class="col-md-6">
            <div class="d-flex align-items-center">
              <label class="form-label col-3">Patient Type</label>
              <select name="pattype" id="pattype" class="form-select form-select-sm" required>
                <option>OP</option>
                <option>Others</option>
              </select>
            </div>
          </div>

          <div class="col-md-4">
            <div class="d-flex align-items-center gap-2">
              <label class="form-label col-4 mb-0">UHID</label>
              <input type="text" id="uhid" name="uhid"
                     class="form-control form-control-sm"
                     placeholder="Enter UHID"
                     maxlength="10" required>
              <button type="button" id="getBtn" class="btn btn-primary btn-sm">Get</button>
            </div>
          </div>
        </div>

        <!-- ================= Row 2 ================= -->
        <div class="row mb-2">
          <div class="col-md-6">
            <div class="d-flex align-items-center">
              <label class="form-label col-3">Patient Name</label>
              <input type="text" id="patname" name="patname"
                     class="form-control form-control-sm" readonly style="border:1px solid #ced4da">
            </div>
          </div>

          <div class="col-md-4">
            <div class="d-flex align-items-center">
              <label class="form-label col-4">Date</label>
              <span class="text-primary fw-semibold">{{date|date:'d-m-Y H:i:s'}}</span>
            </div>
          </div>
        </div>

        <!-- ================= Row 3 ================= -->
        <div class="row mb-2">
          <div class="col-md-6">
            <div class="d-flex align-items-center">
              <label class="form-label col-3">Age</label>
              <input type="text" id="age" class="form-control form-control-sm me-1" readonly style="border:1px solid #ced4da">
              <select id="agetype" class="form-select form-select-sm me-1" disabled style="border:1px solid #ced4da">
                <option>Years</option>
                <option>Months</option>
                <option>Days</option>
              </select>
              <input type="text" id="gender" class="form-control form-control-sm" readonly style="border:1px solid #ced4da">
            </div>
          </div>

          <div class="col-md-4">
            <div class="d-flex align-items-center">
              <label class="form-label col-4">Ref Doctor</label>
              <input type="text" id="refdoctor" class="form-control form-control-sm" readonly style="border:1px solid #ced4da">
            </div>
          </div>
        </div>

        <!-- ================= Row 4 ================= -->
        <div class="row mb-2">
          <div class="col-md-6">
            <div class="d-flex align-items-center">
              <label class="form-label col-3">Doctor</label>

              <!-- OP Doctor -->
              <!-- OP Doctor -->
<div class="position-relative flex-grow-1" id="opDoctorWrapper">
  <input type="text" id="doc"
         class="form-control form-control-sm"
         placeholder="Type doctor name..."  autocomplete="off">
  <ul id="op-doctor-suggestions"
      class="list-group suggestion-list"></ul>
</div>

<input type="hidden" id="doc_id" name="doctor">
              <!-- Others Doctor -->
              <div class="position-relative flex-grow-1 d-none" id="otherDoctorWrapper">
                <input type="text"
                       id="other_doctor"
                       class="form-control form-control-sm"
                       placeholder="Type doctor name..."  autocomplete="off">
                <input type="hidden" id="other_doctor_id" name="other_doctor_id" >
                <ul id="other-doctor-suggestions"
                    class="list-group suggestion-list"></ul>
              </div>
            </div>
          </div>

          <div class="col-md-4">
            <div class="d-flex align-items-center">
              <label class="form-label col-4">Phone</label>
              <input type="text" id="phone" class="form-control form-control-sm" readonly style="border:1px solid #ced4da">
            </div>
          </div>
        </div>

        <!-- ================= Services ================= -->
        <div class="row mb-2">
          <div class="col-md-6">
            <div class="d-flex align-items-center">
              <label class="form-label col-3">Services</label>
              <div class="position-relative flex-grow-1">
                <input type="text" id="service" class="form-control form-control-sm"
                       placeholder="Enter services">
                <ul id="serviceSuggestions" class="list-group suggestion-list"></ul>
              </div>
            </div>
          </div>
        </div>

        <!-- ================= TABLE ================= -->
        <div class="table-responsive col-10 mt-4">
          <table class="table table-bordered table-sm align-middle">
            <thead class="table-light">
              <tr class="text-center">
                <th width="50">S.No</th>
                <th>Service</th>
                <th width="80">Qty</th>
                <th width="100">Cost</th>
                <th width="90">Action</th>
              </tr>
            </thead>
            <tbody id="serviceBody"></tbody>
          </table>
        </div>

        <!-- ================= AMOUNTS ================= -->
        <!-- {# ============================================================
   INVESTIGATION — SPLIT PAYMENT SECTION
   Replace the existing "Amounts" row (payingamount / paymentmode /
   extraFieldDiv / due / netamount) with this block.
   Everything else in OpInvestigation.html stays unchanged.
============================================================ #} -->

<!-- Amounts Row — Split Payment -->
<div class="row mb-1 mt-1">

  <!-- Net Amount (readonly, unchanged) -->
  <div class="col-md-2">
    <label class="form-label">Net Amount</label>
    <input type="text" id="netamount" name="netamount"
           class="form-control form-control-sm" readonly
           style="border:1px solid #ced4da">
  </div>

  <!-- Cash Amount (always visible) -->
  <div class="col-md-2">
    <label class="form-label">Cash Amt</label>
    <input type="number" id="cash_amt" name="cash_amt"
           class="form-control form-control-sm" value="0" min="0"
           maxlength="7" autocomplete="off"
           oninput="if(this.value.length>7)this.value=this.value.slice(0,7);"
           onkeydown="['e','E','+','-'].includes(event.key)&&event.preventDefault()"
           onblur="recalcInvSplit()">
  </div>

  <!-- + Online toggle -->
  <div class="col-md-2 d-flex align-items-end">
    <div class="form-check mb-1">
      <input class="form-check-input" type="checkbox" id="invOnlineChk"
             onchange="toggleInvOnline(this.checked)">
      <label class="form-check-label" for="invOnlineChk">+ Online</label>
    </div>
  </div>

  <!-- Online Mode (hidden until checkbox ticked) -->
  <div class="col-md-2" id="invOnlineModeDiv" style="display:none;">
    <label class="form-label">Online Mode</label>
    <select id="inv_online_mode" name="online_mode"
            class="form-select form-select-sm"
            onchange="updateInvOnlineLabel(); recalcInvSplit()">
      <option value="">-- Select --</option>
      {% for p in payee_list %}
        {% if p.name|lower != "cash" %}
          <option value="{{ p.name }}">{{ p.name }}</option>
        {% endif %}
      {% endfor %}
    </select>
  </div>

  <!-- Online Amount (hidden until checkbox ticked) -->
  <div class="col-md-2" id="invOnlineAmtDiv" style="display:none;">
    <label class="form-label">Online Amt</label>
    <input type="number" id="online_amt" name="online_amt"
           class="form-control form-control-sm" value="0" min="0"
           maxlength="7" autocomplete="off"
           oninput="if(this.value.length>7)this.value=this.value.slice(0,7);"
           onkeydown="['e','E','+','-'].includes(event.key)&&event.preventDefault()"
           onblur="recalcInvSplit()">
  </div>

  <!-- Online Details (UPI no / card name etc) -->
  <div class="col-md-2" id="invOnlineDetailsDiv" style="display:none;">
    <label class="form-label" id="invOnlineDetailsLabel">Reference</label>
    <input type="text" id="online_details" name="online_details"
           class="form-control form-control-sm" maxlength="12"
           autocomplete="off">
  </div>

</div>

<!-- Paying / Due / Concession Row -->
<div class="row mb-1">

  <!-- Paying Amt (readonly, auto-calculated) -->
  <div class="col-md-2">
    <label class="form-label">Paying Amount</label>
    <input type="text" id="payingamount" name="payingamount"
           class="form-control form-control-sm" readonly
           style="border:1px solid #ced4da">
  </div>

  <!-- Due Amt (readonly) -->
  <div class="col-md-2">
    <label class="form-label">Due Amt</label>
    <input type="text" id="due" name="due"
           class="form-control form-control-sm" readonly
           style="border:1px solid #ced4da">
  </div>

  <!-- Concession -->
  <div class="col-md-2">
    <label class="form-label">Conc. Amount</label>
    <input type="text" id="concamount" name="concamount"
           class="form-control form-control-sm" maxlength="7"
           autocomplete="off" onblur="recalcInvSplit()">
  </div>

  <!-- Reason -->
  <div class="col-md-4">
    <label class="form-label">Reason</label>
    <input type="text" id="reason" name="concession_reason"
           class="form-control form-control-sm" autocomplete="off">
  </div>

</div>


      
        <!-- ================= FOOTER ================= -->
        <div class="bottom d-flex align-items-center mt-3">
          <div class="col-md-2">
            <input type="password" id="usercode" name="usercode"
                   class="form-control" required
                   style="background-color: yellow;"
                   maxlength="12" placeholder="Enter User Code">
          </div>

          <div class="flex-grow-1 text-center">
            <button type="submit" class="btn btn-success btn-sm">💾 Save</button>
            <button type="button" class="btn btn-secondary btn-sm" id="cancelBtn">Cancel</button>
          </div>

          <div style="width:200px;"></div>
        </div>

      </form>
    </div>
  </div>
</div>

<script>
  function highlightMatch(text, query) {
    if (!query) return text;
    const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
}

</script>

<!-- ================================================================
     READONLY TAB SKIP + toggleDoctor
================================================================ -->
<script>
$(document).ready(function () {
    $("input[readonly]:not(#other_doctor), textarea[readonly]").attr("tabindex", "-1");
});

function toggleDoctor(type, autoFocus = false) {
    const opWrapper = document.getElementById("opDoctorWrapper");
    const other     = document.getElementById("otherDoctorWrapper");

    if (type === "Others") {
        opWrapper.classList.add("d-none");
        other.classList.remove("d-none");

        $("#doc").val("");
        $("#doc_id").val("");

        $("#other_doctor")
            .prop("readonly", false)
            .prop("disabled", false)
            .removeAttr("tabindex");

    } else {
        opWrapper.classList.remove("d-none");
        other.classList.add("d-none");

        $("#other_doctor").val("");
        $("#other_doctor_id").val("");
    }
}
</script>

<!-- ================================================================
     UTILITY + FORM SUBMIT + DATE + SERVICE AUTOCOMPLETE + TABLE
================================================================ -->
<script>

/* ============================
   UTILITY FUNCTIONS
============================ */
function allowOnlyNumbers(input) {
    input.value = input.value.replace(/[^0-9]/g, "");
}

function recalcTotals(resetPayment = false) {
    const rows  = document.querySelectorAll("#serviceBody tr");
    const netEl = document.getElementById("netamount");

    let netTotal = 0;
    rows.forEach(tr => {
        const costInput = tr.querySelector("input[name='cost[]']");
        netTotal += parseFloat(costInput ? costInput.value : 0);
    });
    netEl.value = netTotal.toFixed(2);

    if (resetPayment) {
        document.getElementById('cash_amt').value   = 0;
        document.getElementById('online_amt').value = 0;
        document.getElementById('concamount').value = '';
        document.getElementById('invOnlineChk').checked = false;
        toggleInvOnline(false);
    }

    // ❌ DELETE THIS BLOCK — no auto-fill cash
    // const concession = ...
    // document.getElementById('cash_amt').value = ...

    recalcInvSplit();
}
function validateAmounts() {
    const net         = parseFloat($("#netamount").val() || 0);
    const payingInput = $("#payingamount");
    const concInput   = $("#concamount");
    const paying      = parseFloat(payingInput.val() || 0);
    const conc        = parseFloat(concInput.val()   || 0);

    if (paying > net) {
        alert("❗ Paying amount cannot exceed Net Amount");
        payingInput.val("").focus();
        recalcTotals();
        return;
    }

    if (conc > net) {
        alert("❗ Concession cannot exceed Net Amount");
        concInput.val("").focus();
        recalcTotals();
        return;
    }

    if ((paying + conc) > net) {
        alert("❗ Paying + Concession cannot exceed Net Amount");
        payingInput.val("");
        concInput.val("");
        recalcTotals();
    }
}

function updateServiceSerial() {
    $("#serviceBody tr").each(function (i) {
        $(this).find("td:first").text(i + 1);
    });
}

/* ============================
   FORM SUBMISSION
============================ */
$("#procedureForm").on("submit", function (e) {
    e.preventDefault();

    if ($("#serviceBody tr").length === 0) {
        alert("Please add at least one service");
        return;
    }

    const type = $("#pattype").val();

   if (type === "OP" && !$("#doc_id").val()) {
    alert("❗ Please select a doctor from suggestions");
    $("#doc").focus();
    return;
}

if (type === "Others" && !$("#other_doctor_id").val()) {
    otherDocAlertShowing = true;
    alert("❗ Please select doctor from suggestions");
    setTimeout(() => {
        otherDocAlertShowing = false;
        $("#other_doctor").focus();
    }, 300);
    return;
}

    $.ajax({
        url: this.action,
        type: "POST",
        data: $(this).serialize(),
        success: function (res) {
            if (res.success && res.redirect_url) {
                window.open(
                    res.redirect_url,
                    '_blank',
                    "width=900,height=650,left=200,top=100,menubar=no,toolbar=no,location=no,status=no,scrollbars=yes,resizable=yes"
                );

                        window.location.href = window.location.pathname;

            } else {
                alert(res.message || "Failed to save procedure bill");
            }
        },
        error: function () {
            alert("Server error. Please try again.");
        }
    });
});

/* ============================
   DATE TIME
============================ */
(function () {
    const now = new Date();
    const formatted = now.toLocaleString("en-US", {
        month: "2-digit", day: "2-digit", year: "numeric",
        hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true
    });
    const dt = document.getElementById("datetime");
    
    if (dt) dt.textContent = formatted;
})();

/* ============================
   SERVICE AUTOCOMPLETE
   — flags
============================ */
let serviceIndex   = -1;
let serviceClicked = false;
let serviceSelected = false;

/* INPUT → fetch suggestions */
$("#service").on("input", function () {
    serviceIndex    = -1;
    serviceSelected = false;

    const q   = this.value.trim();
    const box = $("#serviceSuggestions");

    box.empty().hide();
    if (!q) return;

    fetch(`/search-service/?q=${encodeURIComponent(q)}`)
        .then(res => res.json())
        .then(data => {
            if (!data.results || !data.results.length) return;

            data.results.forEach((item, i) => {
                box.append(
                    `<li class="list-group-item service-item"
                         data-id="${item.id}"
                         data-name="${item.name}"
                         data-cost="${item.charge}"
                         data-index="${i}">
                       ${item.name} (₹${item.charge})
                     </li>`
                );
            });
            box.show();
        });
});

/* KEYBOARD NAVIGATION */
$("#service").on("keydown", function (e) {
    const items = $("#serviceSuggestions .service-item");

    /* list not visible → let global Tab handler take over normally */
    if (!$("#serviceSuggestions").is(":visible") || !items.length) {
        serviceSelected = false;
        return;
    }

    if (e.key === "Escape") {
        $("#serviceSuggestions").hide();
        serviceIndex = -1;
        items.removeClass("active");
        return;
    }

    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        serviceIndex = e.key === "ArrowDown"
            ? (serviceIndex + 1) % items.length
            : (serviceIndex - 1 + items.length) % items.length;
        highlightServiceItem(items);
        return;
    }

    if (e.key === "Enter") {
        e.preventDefault();
        if (serviceIndex === -1) serviceIndex = 0;
        selectServiceItem($(items[serviceIndex]));
        return;
    }

    if (e.key === "Tab") {
        /* second Tab after a selection → allow normal tab flow */
        if (serviceSelected) {
            serviceSelected = false;
            return;
        }
        /* first Tab → select top/highlighted item */
        e.preventDefault();
        if (serviceIndex === -1) serviceIndex = 0;
        selectServiceItem($(items[serviceIndex]));
    }
});

function highlightServiceItem(items) {
    items.removeClass("active");
    const active = $(items[serviceIndex]);
    active.addClass("active");

    const container = $("#serviceSuggestions")[0];
    if (container && active.length) {
        const a = active[0].getBoundingClientRect();
        const c = container.getBoundingClientRect();
        if (a.top < c.top)         container.scrollTop -= (c.top - a.top);
        else if (a.bottom > c.bottom) container.scrollTop += (a.bottom - c.bottom);
    }
}

function selectServiceItem(item) {
    const id       = item.data("id");
    const name     = item.data("name");
    const unitCost = parseFloat(item.data("cost"));

    addServiceRow(id, name, unitCost);

    $("#service").val("");
    $("#serviceSuggestions").hide();
    serviceIndex    = -1;
    serviceSelected = true;
}

/* MOUSE → mousedown flag so blur doesn't fire early */
$(document).on("mousedown", ".service-item", function () {
    serviceClicked = true;
});

/* ✅ SINGLE click handler — calls selectServiceItem, no duplication */
$(document).on("click", ".service-item", function (e) {
    e.preventDefault();
    selectServiceItem($(this));
    setTimeout(() => { serviceClicked = false; }, 150);
});

/* BLUR — clear input if nothing was properly selected */
$("#service").on("blur", function () {
    setTimeout(() => {
        if (serviceClicked) return;
        if ($(this).val().trim()) $(this).val("");
        $("#serviceSuggestions").hide();
    }, 200);
});

/* ============================
   ADD ROW (single place)
============================ */
function addServiceRow(id, name, unitCost) {
    if ($(`tr[data-service="${id}"]`).length) {
        alert("❗ Service already added");
        return;
    }

    const row = `
<tr data-service="${id}">
  <td class="text-center"></td>
  <td>
    ${name}
    <input type="hidden" name="service_id[]"  value="${id}">
    <input type="hidden" name="servicename[]" value="${name}">
  </td>
  <td class="text-center">
    <input type="number" class="form-control form-control-sm qty"
           value="1" min="1" disabled>
    <input type="hidden" name="qty[]" value="1">
  </td>
  <td class="text-end">
    <input type="number" class="form-control form-control-sm cost"
           value="${unitCost.toFixed(2)}"
           data-unit="${unitCost}"
           min="0" disabled>

async function loadPatientDetailsAuto(uhid) {
    try {
        let r = await fetch(`/get-patient-details1/?uhid=${uhid}`);
        let j = await r.json();
        if (j.success) {
            fillOPData(j.data);
            $("#pattype").val("OP");
            toggleDoctor("OP", false);
            loadedUHID = uhid;
            loadedType = "OP";
            return;
        }
    } catch {}

    try {
        let r = await fetch(`/get-patient-details-op/?uhid=${uhid}`);
        let j = await r.json();
        if (j.success) {
            fillOthersData(j.data);
            $("#pattype").val("Others");
            toggleDoctor("Others", false);
            loadedUHID = uhid;
            loadedType = "Others";
            return;
        }
    } catch {}

    alert("Invalid UHID");
    clearFields();
}

function clearFields() {
    $("#patname,#age,#agetype,#gender,#phone,#refdoctor,#doc").val("");
    $("#other_doctor").val("");
    $("#other_doctor_id").val("");
    loadedUHID = null;
    loadedType = null;

    if (this.value.trim()) loadPatientDetailsAuto(this.value.trim());
});

$("#pattype").on("change", function () {
    toggleDoctor(this.value);
    if (loadedUHID && this.value !== loadedType) clearFields();
});

$("#getBtn").on("click", function () {
    const uhid = $("#uhid").val().trim();
    const type = $("#pattype").val();
    let url = type === "OP"
        ? "/search-consultation-uhid/?return=OPProcedureView"
        : "/search-uhid/?return=OPProcedureView";

});

    if (uhid) {
        $("#uhid").val(uhid);
        loadPatientDetailsAuto(uhid);
    }
});

<!-- ================================================================
     GLOBAL TAB NAVIGATION (skips readonly/disabled)
     NOTE: service #keydown above calls e.preventDefault() when the
     suggestion list is open, so this handler never fires for those
     Tab presses — no conflict.
================================================================ -->
<script>
$(document).on("keydown", "input, select, textarea", function (e) {
    if (e.key !== "Tab") return;

    /* If the service suggestion list is open, let the service
       keydown handler deal with Tab — don't interfere. */
    if (
        this.id === "service" &&
        $("#serviceSuggestions").is(":visible") &&
        $("#serviceSuggestions .service-item").length
    ) return;

    const focusable = $(
        "input:not([readonly]):not([disabled]), " +
        "select:not([disabled]), " +
        "textarea:not([readonly]):not([disabled]), " +
        "button:not([disabled])"
    ).filter(":visible");

    const index = focusable.index(this);
    if (index === -1) return;

    e.preventDefault();

    if (e.shiftKey) {
        if (index > 0) focusable.eq(index - 1).focus();
    } else {
        if (index < focusable.length - 1) focusable.eq(index + 1).focus();
    }
});
</script>

<script>
let otherDocIndex        = -1;
let otherDocClicked      = false;
let otherDocSelected     = false;
let otherDocAlertShowing = false;   /* ← prevents infinite alert loop */

const otherDocURL = "/search-doctors/";

$("#other_doctor").on("input", function () {
    $("#other_doctor_id").val("");
    otherDocIndex    = -1;
    otherDocSelected = false;

    let q   = $(this).val().trim();
    let box = $("#other-doctor-suggestions");

    box.empty().hide();
    if (!q) return;

    $.get(otherDocURL, { q: q }, function (res) {
        let data = res.results || [];
        if (!data.length) return;

        let html = "";
        data.forEach((item, i) => {
            html += `
                <a href="#" class="list-group-item list-group-item-action other-doc-item"
                   data-id="${item.id}"
                   data-name="${item.name}"
                   data-index="${i}">
                   ${highlightMatch(item.name, q)}  
                </a>`;
        });

        box.html(html).show();
    });
});

$("#other_doctor").on("keydown", function (e) {
    let items = $(".other-doc-item");

    if (!$("#other-doctor-suggestions").is(":visible") || items.length === 0) {
        otherDocSelected = false;
        return;
    }

    if (e.key === "Escape") {
        $("#other-doctor-suggestions").hide();
        otherDocIndex = -1;
        items.removeClass("active");
        return;
    }

    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        otherDocIndex = e.key === "ArrowDown"
            ? (otherDocIndex + 1) % items.length
            : (otherDocIndex - 1 + items.length) % items.length;
        highlightOtherDoctor(items);
        return;
    }

    if (e.key === "Enter") {
        e.preventDefault();
        if (otherDocIndex === -1) otherDocIndex = 0;
        selectOtherDoctor($(items[otherDocIndex]));
        return;
    }

    if (e.key === "Tab") {
        if (otherDocSelected) {
            otherDocSelected = false;
            return;
        }
        e.preventDefault();
        if (otherDocIndex === -1) otherDocIndex = 0;
        selectOtherDoctor($(items[otherDocIndex]));
    }
});

function highlightOtherDoctor(items) {
    items.removeClass("active");
    let active    = $(items[otherDocIndex]);
    active.addClass("active");

    let container = $("#other-doctor-suggestions")[0];
    if (container && active.length) {
        const a = active[0].getBoundingClientRect();
        const c = container.getBoundingClientRect();
        if (a.top < c.top)            container.scrollTop -= (c.top - a.top);
        else if (a.bottom > c.bottom) container.scrollTop += (a.bottom - c.bottom);
    }
}

$(document).on("mousedown", ".other-doc-item", function () {
    otherDocClicked = true;
});

$(document).on("click", ".other-doc-item", function (e) {
    e.preventDefault();
    selectOtherDoctor($(this));
    setTimeout(() => { otherDocClicked = false; }, 150);
});

function selectOtherDoctor(item) {
    $("#other_doctor").val(item.data("name"));
    $("#other_doctor_id").val(item.data("id"));
    $("#other-doctor-suggestions").hide();
    otherDocSelected = true;

    setTimeout(() => { $("#service").focus(); }, 100);
}

$("#other_doctor").on("blur", function () {
    setTimeout(() => {
        if (otherDocClicked) return;
        if (otherDocAlertShowing) return;

        let name = $(this).val().trim();

        if (!name) {
            if (!$("#other_doctor_id").val()) {
                otherDocAlertShowing = true;
                alert("❗ Doctor cannot be empty!");
                setTimeout(() => {
                    otherDocAlertShowing = false;
                    $("#other_doctor").focus();
                }, 300);
            }
            return;
        }

        $.get(otherDocURL, { q: name }, function (res) {
            let exists = (res.results || [])
                .some(x => x.name.toUpperCase() === name.toUpperCase());

            if (!exists) {
                otherDocAlertShowing = true;
                alert("❗ Doctor not found! Select from suggestions.");
                setTimeout(() => {
                    otherDocAlertShowing = false;
                    $("#other_doctor").val("");
                    $("#other_doctor_id").val("");
                    $("#other_doctor").focus();
                }, 300);
            }
        });

    }, 200);
});



</script>

<script>
/* ================================================================
   INVESTIGATION SPLIT PAYMENT LOGIC
================================================================ */

function toggleInvOnline(show) {
    document.getElementById('invOnlineModeDiv').style.display   = show ? '' : 'none';
    document.getElementById('invOnlineAmtDiv').style.display    = show ? '' : 'none';
    document.getElementById('invOnlineDetailsDiv').style.display = 'none';

    if (!show) {
        document.getElementById('online_amt').value     = 0;
        document.getElementById('inv_online_mode').value = '';
        document.getElementById('online_details').value  = '';
        recalcInvSplit();
    }
}

function updateInvOnlineLabel() {
    const mode  = document.getElementById('inv_online_mode').value.trim().toLowerCase();
    const div   = document.getElementById('invOnlineDetailsDiv');
    const label = document.getElementById('invOnlineDetailsLabel');

    if (!mode) { div.style.display = 'none'; return; }

    if      (mode === 'card')   label.innerText = 'Card Name';
    else if (mode === 'upi')    label.innerText = 'UPI Number';
    else if (mode === 'cheque') label.innerText = 'Cheque No';
    else if (mode === 'neft')   label.innerText = 'NEFT Ref No';
    else                        label.innerText = 'Reference';

    div.style.display = '';
}

function recalcInvSplit() {
    const net        = parseFloat(document.getElementById('netamount').value   || 0);
    const cash       = parseFloat(document.getElementById('cash_amt').value    || 0);
    const online     = parseFloat(document.getElementById('online_amt').value  || 0);
    const concession = parseFloat(document.getElementById('concamount').value  || 0);

    // Guard: concession cannot exceed net
    if (concession > net) {
        alert(`❗ Concession (₹${concession}) cannot exceed Net Amount (₹${net})!`);
        document.getElementById('concamount').value = 0;
        recalcInvSplit();
        return;
    }

    const maxPayable = Math.max(net - concession, 0);
    const totalPaid  = cash + online;

    // Guard: cash + online cannot exceed net - concession
 if (totalPaid > maxPayable) {
    alert(`❗ Cash + Online (₹${totalPaid}) cannot exceed Net − Concession (₹${maxPayable})!`);
    // Cap cash to maxPayable, zero out online
    document.getElementById('cash_amt').value   = maxPayable;
    document.getElementById('online_amt').value = 0;
    // NO recursive call — just return, values are now valid
    return;
}

    const paid = cash + parseFloat(document.getElementById('online_amt').value || 0);
    const due  = Math.max(net - paid - concession, 0);

    document.getElementById('payingamount').value = paid;
    document.getElementById('due').value          = due.toFixed(2);
}


/* ── Override hardResetForm to also clear split fields ── */
const _origHardReset = typeof hardResetForm === 'function' ? hardResetForm : null;

function hardResetForm() {
    if (_origHardReset) _origHardReset();

    document.getElementById('cash_amt').value    = 0;
    document.getElementById('online_amt').value  = 0;
    document.getElementById('inv_online_mode').value = '';
    document.getElementById('online_details').value  = '';
    document.getElementById('invOnlineChk').checked  = false;
    toggleInvOnline(false);
    recalcInvSplit();
}

/* ── Wire events on DOMContentLoaded ── */
document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('cash_amt').addEventListener('input',   recalcInvSplit);
    document.getElementById('online_amt').addEventListener('input',  recalcInvSplit);
    document.getElementById('concamount').addEventListener('input',  recalcInvSplit);
    document.getElementById('inv_online_mode').addEventListener('change', function () {
        updateInvOnlineLabel();
        recalcInvSplit();
    });
});

/* ── Form submit: validate online mode selected ── */
document.getElementById("procedureForm").addEventListener('submit', function (e) {
    const onlineChk  = document.getElementById('invOnlineChk').checked;
    const onlineMode = document.getElementById('inv_online_mode').value.trim();
    const onlineAmt  = parseFloat(document.getElementById('online_amt').value || 0);

    if (onlineChk && onlineAmt > 0 && !onlineMode) {
        e.preventDefault();
        e.stopImmediatePropagation();
        alert('❗ Please select an Online Payment Mode (UPI / Card / Cheque / NEFT).');
        document.getElementById('inv_online_mode').focus();
        return false;
    }
}, true); // capture phase — fires before existing submit handler
</script>
