{% extends 'hospApp/home.html' %}
{% block content %}

<div class="container-fluid">
  <div class="card form-card">

    <div class="form-header py-2">
      <h6 class="mb-0">OP-Investigation</h6>
    </div>

    <div class="card-body">
      <form method="post"
      id="investigationForm"
      action="{% url 'save_investigation' %}"
      data-due-field="#due"
      data-reason-field="#reason" autocomplete="off">

        {% csrf_token %}

        <!-- Row 1 -->
        <div class="row mb-2">
          <div class="col-md-6">
            <div class="d-flex align-items-center">
              <label class="form-label col-3">Patient Type</label>
              <select name="pattype" id="pattype"
                      class="form-select form-select-sm" required>
                <option>OP</option>
                <option>Others</option>
              </select>
            </div>
          </div>

          <div class="col-md-4">
            <div class="d-flex align-items-center gap-2">
              <label class="form-label col-4 mb-0">UHID</label>
              <input type="text" id="uhid" name="uhid"
                     class="form-control form-control-sm"
                     placeholder="Enter UHID"
                     maxlength="10" required autocomplete="off">
              <button type="button" id="getBtn"
                      class="btn btn-primary btn-sm">
                Get
              </button>
            </div>
          </div>
        </div>

        <!-- Row 2 -->
        <div class="row mb-1">
          <div class="col-md-6 mb-2 mb-md-0">
            <div class="d-flex align-items-center">
              <label class="form-label col-3">Patient Name</label>
              <input type="text" id="patname" class="form-control form-control-sm" name="patname" readonly style="border:1px solid #ced4da">
            </div>
          </div>

          <div class="col-md-4 mb-2 mb-md-0">
            <div class="d-flex align-items-center">
              <label class="form-label col-4">Patient ID</label>
              <input type="text" id="patid" class="form-control form-control-sm" name="patid" required readonly style="border:1px solid #ced4da">
            </div>
          </div>
        </div>

        <!-- Row 3 -->
        <div class="row mb-1">
          <div class="col-md-6 mb-2 mb-md-0">
            <div class="d-flex align-items-center">
              <label class="form-label col-3">Age</label>
              <input type="text" id="age" class="form-control form-control-sm me-1" readonly name="age" style="border:1px solid #ced4da">
              <select id="agetype_display" class="form-select form-select-sm me-1" disabled style="border:1px solid #ced4da">
                <option value="">-- Select --</option>
                <option value="Years">Years</option>
                <option value="Months">Months</option>
                <option value="Days">Days</option>
              </select>
              <input type="hidden" id="agetype" name="agetype">
              <input type="text" id="gender" class="form-control form-control-sm" name="gender" readonly style="border:1px solid #ced4da">
            </div>
          </div>

          <div class="col-md-4 mb-1 mb-md-0">
            <div class="d-flex align-items-center">
              <label class="form-label col-4">Ref Doctor</label>
              <input type="text" id="refdoctor" class="form-control form-control-sm" readonly style="border:1px solid #ced4da">
              <input type="hidden" id="refdoctor_id" name="refdoctor_id">
            </div>
          </div>
        </div>

        <!-- Doctor + Phone -->
        <div class="row mb-1" id="doctorPhoneRow">
          <div class="col-md-6 mb-2 mb-md-0">
            <div class="d-flex align-items-center">
              <label class="form-label col-3">Doctor</label>

              <!-- OP Doctor -->
              <div class="position-relative flex-grow-1" id="opDoctorWrapper">
                <input type="text" id="doc_name"
                       class="form-control form-control-sm"
                       placeholder="Type doctor name..." autocomplete="off">
                <ul id="op-doctor-suggestions"
                    class="list-group suggestion-list"></ul>
              </div>
              <input type="hidden" id="doc_id" name="doctor">

              <!-- Others Doctor -->
              <div class="position-relative flex-grow-1 d-none" id="otherDoctorWrapper">
                <input type="text"
                       id="other_doctor"
                       class="form-control form-control-sm"
                       placeholder="Type doctor name..." autocomplete="off">
                <input type="hidden" id="other_doctor_id" name="other_doctor_id">
                <ul id="other-doctor-suggestions"
                    class="list-group suggestion-list"></ul>
              </div>
            </div>
          </div>

          <div class="col-md-4">
            <div class="d-flex align-items-center">
              <label class="form-label col-4">Phone</label>
              <input type="text" name="phone" id="phone"
                     class="form-control form-control-sm" readonly style="border:1px solid #ced4da">
            </div>
          </div>
        </div>

        <!-- Investigations -->
        <div class="row mb-1">
          <div class="col-md-6">
            <div class="d-flex align-items-center">
              <label class="form-label col-3">Investigations</label>
              <div class="position-relative flex-grow-1">
                <input type="text" id="service"
                       class="form-control form-control-sm"
                       placeholder="Enter Investigations..." >
                <ul id="invSuggestions" class="list-group suggestion-list"></ul>
              </div>
            </div>
          </div>
        </div>

        <!-- Investigation Table -->
        <div class="table-responsive col-10 mt-2">
          <table class="table table-bordered table-sm align-middle">
            <thead class="table-light">
              <tr class="text-center">
                <th style="width:60px;">S.No</th>
                <th>Investigation</th>
                <th style="width:120px;">Cost</th>
                <th style="width:90px;">Action</th>
              </tr>
            </thead>
            <tbody id="investigationBody"></tbody>
          </table>
        </div>

        <!-- Amounts -->
        <!-- {# ============================================================
   INVESTIGATION — SPLIT PAYMENT SECTION
   Replace the existing "Amounts" row (payingamount / paymentmode /
   extraFieldDiv / due / netamount) with this block.
   Everything else in OpInvestigation.html stays unchanged.
============================================================ #} -->

<!-- Amounts Row — Split Payment -->
<div class="row mb-1 mt-1">

  <!-- Net Amount (readonly, unchanged) -->
  <div class="col-md-2">
    <label class="form-label">Net Amount</label>
    <input type="text" id="netamount" name="netamount"
           class="form-control form-control-sm" readonly
           style="border:1px solid #ced4da">
  </div>

  <!-- Cash Amount (always visible) -->
  <div class="col-md-2">
    <label class="form-label">Cash Amt</label>
    <input type="number" id="cash_amt" name="cash_amt"
           class="form-control form-control-sm" value="0" min="0"
           maxlength="7" autocomplete="off"
           oninput="if(this.value.length>7)this.value=this.value.slice(0,7);"
           onkeydown="['e','E','+','-'].includes(event.key)&&event.preventDefault()"
           onblur="recalcInvSplit()">
  </div>

  <!-- + Online toggle -->
  <div class="col-md-2 d-flex align-items-end">
    <div class="form-check mb-1">
      <input class="form-check-input" type="checkbox" id="invOnlineChk"
             onchange="toggleInvOnline(this.checked)">
      <label class="form-check-label" for="invOnlineChk">+ Online</label>
    </div>
  </div>

  <!-- Online Mode (hidden until checkbox ticked) -->
  <div class="col-md-2" id="invOnlineModeDiv" style="display:none;">
    <label class="form-label">Online Mode</label>
    <select id="inv_online_mode" name="online_mode"
            class="form-select form-select-sm"
            onchange="updateInvOnlineLabel(); recalcInvSplit()">
      <option value="">-- Select --</option>
      {% for p in payee_list %}
        {% if p.name|lower != "cash" %}
          <option value="{{ p.name }}">{{ p.name }}</option>
        {% endif %}
      {% endfor %}
    </select>
  </div>

  <!-- Online Amount (hidden until checkbox ticked) -->
  <div class="col-md-2" id="invOnlineAmtDiv" style="display:none;">
    <label class="form-label">Online Amt</label>
    <input type="number" id="online_amt" name="online_amt"
           class="form-control form-control-sm" value="0" min="0"
           maxlength="7" autocomplete="off"
           oninput="if(this.value.length>7)this.value=this.value.slice(0,7);"
           onkeydown="['e','E','+','-'].includes(event.key)&&event.preventDefault()"
           onblur="recalcInvSplit()">
  </div>

  <!-- Online Details (UPI no / card name etc) -->
  <div class="col-md-2" id="invOnlineDetailsDiv" style="display:none;">
    <label class="form-label" id="invOnlineDetailsLabel">Reference</label>
    <input type="text" id="online_details" name="online_details"
           class="form-control form-control-sm" maxlength="12"
           autocomplete="off">
  </div>

</div>

<!-- Paying / Due / Concession Row -->
<div class="row mb-1">

  <!-- Paying Amt (readonly, auto-calculated) -->
  <div class="col-md-2">
    <label class="form-label">Paying Amount</label>
    <input type="text" id="payingamount" name="payingamount"
           class="form-control form-control-sm" readonly
           style="border:1px solid #ced4da">
  </div>

  <!-- Due Amt (readonly) -->
  <div class="col-md-2">
    <label class="form-label">Due Amt</label>
    <input type="text" id="due" name="due"
           class="form-control form-control-sm" readonly
           style="border:1px solid #ced4da">
  </div>

  <!-- Concession -->
  <div class="col-md-2">
    <label class="form-label">Conc. Amount</label>
    <input type="text" id="concamount" name="concamount"
           class="form-control form-control-sm" maxlength="7"
           autocomplete="off" onblur="recalcInvSplit()">
  </div>

  <!-- Reason -->
  <div class="col-md-4">
    <label class="form-label">Reason</label>
    <input type="text" id="reason" name="concession_reason"
           class="form-control form-control-sm" autocomplete="off">
  </div>

</div>


        

        <!-- Footer -->
        <div class="bottom d-flex align-items-center mt-3">
          <div class="col-md-2">
            <input type="password" id="usercode" name='usercode'
                   class="form-control" required
                   style='background-color: yellow;'
                   maxlength="12" placeholder="Enter User Code" autocomplete="off">
          </div>

          <div class="flex-grow-1 text-center">
            <button type="submit" class="btn btn-success btn-sm">💾 Save</button>
            <button type="button" class="btn btn-secondary btn-sm"
                    id="cancelBtn">Cancel</button>
          </div>

          <div style="width:200px;"></div>
        </div>

      </form>
    </div>
  </div>
</div>

<!-- 
{# ─────────────────────────────────────────────────────────────────────
   SPLIT PAYMENT JAVASCRIPT FOR INVESTIGATION
   Add this <script> block anywhere after the form in OpInvestigation.html.
   It REPLACES the old paymentmode / extraFieldDiv logic entirely.
───────────────────────────────────────────────────────────────────── #} -->
<script>
/* ================================================================
   INVESTIGATION SPLIT PAYMENT LOGIC
================================================================ */

function toggleInvOnline(show) {
    document.getElementById('invOnlineModeDiv').style.display   = show ? '' : 'none';
    document.getElementById('invOnlineAmtDiv').style.display    = show ? '' : 'none';
    document.getElementById('invOnlineDetailsDiv').style.display = 'none';

    if (!show) {
        document.getElementById('online_amt').value     = 0;
        document.getElementById('inv_online_mode').value = '';
        document.getElementById('online_details').value  = '';
        recalcInvSplit();
    }
}

function updateInvOnlineLabel() {
    const mode  = document.getElementById('inv_online_mode').value.trim().toLowerCase();
    const div   = document.getElementById('invOnlineDetailsDiv');
    const label = document.getElementById('invOnlineDetailsLabel');

    if (!mode) { div.style.display = 'none'; return; }

    if      (mode === 'card')   label.innerText = 'Card Name';
    else if (mode === 'upi')    label.innerText = 'UPI Number';
    else if (mode === 'cheque') label.innerText = 'Cheque No';
    else if (mode === 'neft')   label.innerText = 'NEFT Ref No';
    else                        label.innerText = 'Reference';

    div.style.display = '';
}

function recalcInvSplit() {
    const net        = parseFloat(document.getElementById('netamount').value   || 0);
    const cash       = parseFloat(document.getElementById('cash_amt').value    || 0);
    const online     = parseFloat(document.getElementById('online_amt').value  || 0);
    const concession = parseFloat(document.getElementById('concamount').value  || 0);

    // Guard: concession cannot exceed net
    if (concession > net) {
        alert(`❗ Concession (₹${concession}) cannot exceed Net Amount (₹${net})!`);
        document.getElementById('concamount').value = 0;
        recalcInvSplit();
        return;
    }

    const maxPayable = Math.max(net - concession, 0);
    const totalPaid  = cash + online;

    // Guard: cash + online cannot exceed net - concession
    if (totalPaid > maxPayable) {
    alert(`❗ Cash + Online (₹${totalPaid}) cannot exceed Net − Concession (₹${maxPayable})!`);
    // Cap cash to maxPayable, zero out online
    document.getElementById('cash_amt').value   = maxPayable;
    document.getElementById('online_amt').value = 0;
    // NO recursive call — just return, values are now valid
    return;
}


    const paid = cash + parseFloat(document.getElementById('online_amt').value || 0);
    const due  = Math.max(net - paid - concession, 0);

    document.getElementById('payingamount').value = paid;
    document.getElementById('due').value          = due.toFixed(2);
}

/* ── Override the existing recalcTotals so it refreshes split too ── */
const _origRecalcTotals = typeof recalcTotals === 'function' ? recalcTotals : null;

function recalcTotals(resetPayment = false) {
    const body   = document.getElementById("investigationBody");
    const netEl  = document.getElementById("netamount");

    let netTotal = 0;
    body.querySelectorAll("tr").forEach(tr => {
        netTotal += parseFloat(tr.dataset.cost || 0);
    });
    netEl.value = netTotal.toFixed(2);

    if (resetPayment) {
        document.getElementById('cash_amt').value   = 0;
        document.getElementById('online_amt').value = 0;
        document.getElementById('concamount').value = '';
        // Reset online toggle too
        document.getElementById('invOnlineChk').checked = false;
        toggleInvOnline(false);
    }

    // Pre-fill cash with net (so it covers total by default)
    const concession = parseFloat(document.getElementById('concamount').value || 0);
    const online     = parseFloat(document.getElementById('online_amt').value  || 0);
    if (!resetPayment) {
        // Only update cash if user hasn't touched it manually
        const currentCash = parseFloat(document.getElementById('cash_amt').value || 0);
        const maxPayable  = Math.max(netTotal - concession, 0);
        // If cash was auto-set (equals remaining), keep tracking
        document.getElementById('cash_amt').value = Math.max(maxPayable - online, 0);
    }

    recalcInvSplit();
}

/* ── Override hardResetForm to also clear split fields ── */
const _origHardReset = typeof hardResetForm === 'function' ? hardResetForm : null;
function hardResetForm() {
    const form = document.getElementById("investigationForm");
    if (form) form.reset();

    const wipe = [
        "uhid", "patname", "patid", "age", "gender",
        "agetype", "agetype_display",
        "refdoctor", "refdoctor_id",
        "doc_name", "doc_id",
        "phone",
        "other_doctor", "other_doctor_id",
        "payingamount", "concamount", "netamount", "due",
        "usercode", "reason"
        // ❌ REMOVED: "paymentdetails" — element no longer exists
    ];
    wipe.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = "";
    });

    // ❌ REMOVE these lines — paymentmode and extraFieldDiv no longer exist
    // const paySelect = document.getElementById("paymentmode");
    // if (paySelect) { ... }
    // const extraDiv = document.getElementById("extraFieldDiv");
    // if (extraDiv) extraDiv.style.display = "none";

    const tbody = document.getElementById("investigationBody");
    if (tbody) tbody.innerHTML = "";

    loadedUHID = null;
    loadedType = null;

    const typeSelect = document.querySelector("select[name='pattype']");
    if (typeSelect) typeSelect.value = "OP";
    toggleFieldsForPatientType("OP");

    // ✅ Reset split payment fields
    document.getElementById('cash_amt').value        = 0;
    document.getElementById('online_amt').value      = 0;
    document.getElementById('inv_online_mode').value = '';
    document.getElementById('online_details').value  = '';
    document.getElementById('invOnlineChk').checked  = false;
    toggleInvOnline(false);
    recalcInvSplit();
}

/* ── Wire events on DOMContentLoaded ── */
document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('cash_amt').addEventListener('input',   recalcInvSplit);
    document.getElementById('online_amt').addEventListener('input',  recalcInvSplit);
    document.getElementById('concamount').addEventListener('input',  recalcInvSplit);
    document.getElementById('inv_online_mode').addEventListener('change', function () {
        updateInvOnlineLabel();
        recalcInvSplit();
    });
});

/* ── Form submit: validate online mode selected ── */
document.getElementById("investigationForm").addEventListener('submit', function (e) {
    const onlineChk  = document.getElementById('invOnlineChk').checked;
    const onlineMode = document.getElementById('inv_online_mode').value.trim();
    const onlineAmt  = parseFloat(document.getElementById('online_amt').value || 0);

    if (onlineChk && onlineAmt > 0 && !onlineMode) {
        e.preventDefault();
        e.stopImmediatePropagation();
        alert('❗ Please select an Online Payment Mode (UPI / Card / Cheque / NEFT).');
        document.getElementById('inv_online_mode').focus();
        return false;
    }
}, true); // capture phase — fires before existing submit handler
</script>

<script>

let initialLoadDone = false;
let invBody, payingInput, concInput, netInput, dueInput;
let loadedUHID = null;
let loadedType = null;

/* ============================
   HARD RESET — covers reload, back button, save success
============================ */
function hardResetForm() {
    const form = document.getElementById("investigationForm");
    if (form) form.reset();

    const wipe = [
        "uhid", "patname", "patid", "age", "gender",
        "agetype", "agetype_display",
        "refdoctor", "refdoctor_id",
        "doc_name", "doc_id",
        "phone",
        "other_doctor", "other_doctor_id",
        "payingamount", "concamount", "netamount", "due",
        "usercode", "reason", "paymentdetails"
    ];
    wipe.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = "";
    });

    // ✅ Explicitly reset payment mode to Cash
    const paySelect = document.getElementById("paymentmode");
    if (paySelect) {
        paySelect.value = "Cash";
        paySelect.dispatchEvent(new Event("change")); // hides UPI/Card/etc field
    }

    const tbody = document.getElementById("investigationBody");
    if (tbody) tbody.innerHTML = "";

    loadedUHID = null;
    loadedType = null;

    const typeSelect = document.querySelector("select[name='pattype']");
    if (typeSelect) typeSelect.value = "OP";
    toggleFieldsForPatientType("OP");

    const extraDiv = document.getElementById("extraFieldDiv");
    if (extraDiv) extraDiv.style.display = "none";
}

// ✅ Covers: F5, reload button, Ctrl+R
window.addEventListener("load", function () {
    const urlUHID = new URLSearchParams(window.location.search).get("uhid");
    if (!urlUHID) {
        setTimeout(hardResetForm, 150);
    }
});

// ✅ Covers: back button, forward button, tab restore (bfcache)
window.addEventListener("pageshow", function (e) {
    const urlUHID = new URLSearchParams(window.location.search).get("uhid");
    if (!urlUHID) {
        setTimeout(hardResetForm, 150);
    }
});
function clearPatientFields() {
    const ids = [
        "patname", "patid", "age", "gender",
        "agetype", "agetype_display",

function recalcTotals(resetPayment = false) {
    const body       = document.getElementById("investigationBody");
    const payingEl   = document.getElementById("payingamount");
    const concEl     = document.getElementById("concamount");
    const netEl      = document.getElementById("netamount");
    const dueEl      = document.getElementById("due");

    let netTotal = 0;
    body.querySelectorAll("tr").forEach(tr => {
        netTotal += parseFloat(tr.dataset.cost || 0);
    });

    netEl.value = netTotal.toFixed(2);

    if (resetPayment) {
        payingEl.value = "";
        concEl.value   = "";
    }

    const paying = parseFloat(payingEl.value || 0);
    const conc   = parseFloat(concEl.value   || 0);
    const due    = netTotal - (paying + conc);
    dueEl.value  = Math.max(0, due).toFixed(2);
}

/* ============================
   INVESTIGATION SUGGEST
============================ */
function createInvestigationSuggest() {
    const input = document.getElementById("service");
    const box   = document.getElementById("invSuggestions");

    let currentIndex = -1;
    let itemClicked  = false;
    let itemSelected = false;

    input.addEventListener("input", function () {
        currentIndex = -1;
        itemSelected = false;

        const q = this.value.trim();
        box.innerHTML    = "";
        box.style.display = "none";
        if (!q) return;

        fetch(`/search-investigation/?q=${encodeURIComponent(q)}`)
            .then(res => res.json())
            .then(data => {
                const list = data.results || [];
                if (!list.length) return;

                let html = "";
                list.forEach((item, i) => {
                    html += `
                        <li class="list-group-item inv-item"
                            data-inv_id="${item.inv_id}"
                            data-name="${item.invname}"
                            data-cost="${item.cost}"
                            data-index="${i}">
                           ${item.invname} (₹${item.cost})
                        </li>`;
                });

                box.innerHTML     = html;
                box.style.display = "block";
            });
    });

    input.addEventListener("keydown", function (e) {
        const items = box.querySelectorAll(".inv-item");
        if (!items.length || box.style.display === "none") return;

        if (e.key === "Escape") {
            box.style.display = "none";
            currentIndex = -1;
            return;
        }

        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            currentIndex = e.key === "ArrowDown"
                ? (currentIndex + 1) % items.length
                : (currentIndex - 1 + items.length) % items.length;
            highlightItem(items);
            return;
        }

        if (e.key === "Enter") {
            e.preventDefault();
            if (currentIndex === -1) currentIndex = 0;
            selectItem(items[currentIndex]);
            return;
        }

        if (e.key === "Tab") {
            if (itemSelected) { itemSelected = false; return; }
            e.preventDefault();
            if (currentIndex === -1) currentIndex = 0;
            selectItem(items[currentIndex]);
        }
    });

    function highlightItem(items) {
        items.forEach(el => el.classList.remove("active"));
        const active = items[currentIndex];
        if (!active) return;
        active.classList.add("active");

        const container = box;
        const a = active.getBoundingClientRect();
        const c = container.getBoundingClientRect();
        if (a.top < c.top)            container.scrollTop -= (c.top - a.top);
        else if (a.bottom > c.bottom) container.scrollTop += (a.bottom - c.bottom);
    }

    function selectItem(item) {
        const inv_id = item.dataset.inv_id;
        const name   = item.dataset.name;
        const cost   = parseFloat(item.dataset.cost);

        addInvestigationRow(inv_id, name, cost);

        input.value       = "";
        box.style.display = "none";
        currentIndex      = -1;
        itemSelected      = true;
    }

    box.addEventListener("mousedown", function () { itemClicked = true; });

    box.addEventListener("click", function (e) {
        const item = e.target.closest(".inv-item");
        if (!item) return;
        selectItem(item);
        setTimeout(() => itemClicked = false, 150);
    });

    input.addEventListener("blur", function () {
        setTimeout(() => {
            if (itemClicked) return;
            if (input.value.trim()) input.value = "";
            box.style.display = "none";
        }, 200);
    });
}

function addInvestigationRow(inv_id, invname, cost) {
    if (!inv_id) { alert("Invalid investigation."); return; }

    if (document.querySelector(`tr[data-inv_id="${inv_id}"]`)) {
        alert("❗ Investigation already added!");
        return;
    }

    const body = document.getElementById("investigationBody");
    const tr   = document.createElement("tr");
    tr.dataset.inv_id = inv_id;
    tr.dataset.cost   = cost;

    tr.innerHTML = `
        <td class="text-center"></td>
        <td>
            ${invname}
            <input type="hidden" name="inv_id[]"   value="${inv_id}">
            <input type="hidden" name="invname[]"  value="${invname}">
            <input type="hidden" name="invcost[]"  value="${cost}">
        </td>
        <td class="text-end">${cost.toFixed(2)}</td>
        <td class="text-center">
            <a href="#" class="text-danger delete-row">Delete</a>
        </td>`;

    body.appendChild(tr);
    updateSerial();
    recalcTotals();
}

async function loadPatientDetailsAuto(uhid) {

        let res     = await fetch(`/get-patient-details1/?uhid=${encodeURIComponent(uhid)}`);
        let payload = await res.json();
        if (payload && payload.success) {
            fillOPData(payload.data || {});
            loadedUHID = uhid;
            loadedType = "OP";
            document.querySelector("select[name='pattype']").value = "OP";
            toggleFieldsForPatientType("OP");
            return;

    } catch(e) {}

    try {
        let res2     = await fetch(`/get-patient-details-op/?uhid=${encodeURIComponent(uhid)}`);
        let payload2 = await res2.json();
        if (payload2 && payload2.success) {
            fillOthersData(payload2.data || {});
            loadedUHID = uhid;
            loadedType = "Others";
            document.querySelector("select[name='pattype']").value = "Others";
            toggleFieldsForPatientType("Others");
            return;

    loadedUHID = null;
    loadedType = null;
}

<script>
$(document).on("keydown", "input, select, textarea", function (e) {
    if (e.key !== "Tab") return;

    const focusable = $(
        "input:not([readonly]):not([disabled]), " +
        "select:not([disabled]), " +
        "textarea:not([readonly]):not([disabled]), " +
        "button:not([disabled])"
    ).filter(":visible");

    const index = focusable.index(this);
    if (index === -1) return;

    e.preventDefault();

    if (e.shiftKey) {
        if (index > 0) focusable.eq(index - 1).focus();
    } else {
        if (index < focusable.length - 1) focusable.eq(index + 1).focus();
    }
});
</script>
