{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Login</title>

    <style>
        /* ===== Reset ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6c63ff, #00b4d8);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== Main Card ===== */
        .login-container {
            background: #fff;
            width: 800px;
            max-width: 95%;
            display: flex;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        /* ===== Left Image Section ===== */
        .login-image {
            flex: 1;
            background: url("{% static 'images/login.jpg' %}") center/cover no-repeat;
        }

        /* ===== Right Form Section ===== */
        .login-card {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-card h2 {
            text-align: center;
            color: #333;
            font-size: 28px;
            margin-bottom: 30px;
        }

        /* ===== Form Fields ===== */
        form input[type="text"],
        form input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        form input:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 5px rgba(108,99,255,0.5);
            outline: none;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .login-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .login-options a {
            color: #6c63ff;
            text-decoration: none;
            transition: 0.3s;
        }

        .login-options a:hover {
            text-decoration: underline;
        }

        /* ===== Button ===== */
        button {
            width: 100%;
            padding: 14px;
            background: #6c63ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5848d8;
        }

        /* ===== Error Messages ===== */
        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
            font-weight: 500;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                width: 95%;
                height: auto;
            }

            .login-image {
                height: 200px;
                background-position: top;
            }

            .login-card {
                padding: 40px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Left Image -->
        <div class="login-image"></div>

        <!-- Right Form -->
        <div class="login-card">
            <h2>Hospital Login</h2>

            {% if messages %}
                {% for message in messages %}
                    <p class="error">{{ message }}</p>
                {% endfor %}
            {% endif %}

            <form method="POST">
                                
                {% csrf_token %}
                {{ form.username }}
                {{ form.password }}

                <div class="login-options">
    <label>
        <input type="checkbox" name="remember_me" checked
            {% if remembered_username %}checked{% endif %}>
        Remember Me
    </label>
</div>

                <button type="submit">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
