{% extends "hospApp/home.html" %}
{% block content %}

<h3>Edit Writing Prescription</h3>
<p><strong>Patient:</strong> {{ prescription.patient_name }}</p>

<div class="border p-3">
    <canvas id="editCanvas" style="width:100%; height:600px; background:#fff; border:1px solid #000;"></canvas>
</div>

<button class="btn btn-success mt-3" id="saveBtn">Save Changes</button>

<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>

<script>
const canvas = document.getElementById("editCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    canvas.width = canvas.offsetWidth * ratio;
    canvas.height = canvas.offsetHeight * ratio;
    ctx.scale(ratio, ratio);
}
resizeCanvas();

let signaturePad = new SignaturePad(canvas, {
    minWidth: 1,
    maxWidth: 3,
    backgroundColor: "white",
    penColor: "black"
});

// Load saved strokes
let strokes = {{ prescription.stroke_data|safe }};
if (strokes) signaturePad.fromData(strokes);

// Save
document.getElementById("saveBtn").onclick = async function() {
    const image = signaturePad.toDataURL("image/png");
    const strokeData = JSON.stringify(signaturePad.toData());

    const fd = new FormData();
    fd.append("image", image);
    fd.append("stroke_data", strokeData);

    const resp = await fetch("{% url 'update_written_prescription' prescription.id %}", {
        method: "POST",
        headers: { "X-CSRFToken": "{{ csrf_token }}" },
        body: fd
    });

    const data = await resp.json();

    if (data.status === "success") {
        if (window.opener && !window.opener.closed) {
            window.opener.postMessage({
                type: "prescription_saved",
                consult_id: data.consult_id
            }, "*");
        }

        alert("Updated Successfully!");
        window.close();
    }
};
</script>

{% endblock %}
