{% extends 'hospApp/home.html' %}
{% load static %}

{% block content %}
<div class="container-fluid"> 

  <!-- Header Card -->
  <div class="card form-card"> 
    <div class="form-header"> 
      <h5>🧑IP Registration</h5>
    </div> <!-- ✅ CLOSE 3 -->

    <!-- Inner Card -->
    <div class="card shadow-sm form-card"> 
      <div class="card-body"> 

        <form method="POST"> <!-- ✅ 6 -->
          {% csrf_token %}

          {% if form.errors %}
          <div class="alert alert-danger"> <!-- ✅ 7 -->
            <ul class="mb-0"> <!-- ✅ 8 -->
              {% for field, errors in form.errors.items %}
              <li><strong>{{ field }}</strong>: {{ errors|striptags }}</li>
              {% endfor %}
            </ul> <!-- ✅ CLOSE 8 -->
          </div> <!-- ✅ CLOSE 7 -->
          {% endif %}

          <!-- 📝 Your input fields will go here -->
         <div class="row mb-2">
          <div class="col-md-3">
          <label>Date:</label>
          <div class="input-group input-group-sm">
            <input type="date" name="date" id="date"  class="form-control form-control-sm">
           <button type="button" id="getBtn" class="btn btn-primary btn-sm">Get</button>
          </div>
          
        </div>
          
          
        </div>
        <div class="row mb-2">
    <div class="col-md-3">
        <label>UHID:</label>
        <input type="text" id="uhid" name="uhid" class="form-control form-control-sm" readonly>
    </div>

    <div class="col-md-3">
        <label>Pt Name:</label>
        <input type="text" id="patname" name="patname" class="form-control form-control-sm" readonly>
    </div>

    <div class="col-md-2">
        <label>Age:</label>
        <input type="text" id="age" name="age" class="form-control form-control-sm" readonly>
    </div>

    <div class="col-md-2">
        <label>Age Type:</label>
        <input type="text" id="agetype" name="agetype" class="form-control form-control-sm" readonly>
    </div>

    <div class="col-md-2">
        <label>Gender:</label>
        <input type="text" id="gender" name="gender" class="form-control form-control-sm" readonly>
    </div>
</div>

<div class="row mb-2">
    <div class="col-md-4">
        <label>Address:</label>
        <input type="text" id="address" name="address" class="form-control form-control-sm" readonly>
    </div>

    <div class="col-md-4">
        <label>Relative:</label>
        <input type="text" id="relative" name="relative" class="form-control form-control-sm" readonly>
    </div>

    <div class="col-md-4">
        <label>Phone:</label>
        <input type="text" id="phone" name="phone" class="form-control form-control-sm" readonly>
    </div>
</div>

<div class="row mb-2">
    <div class="col-md-4">
        <label>Ref Doctor:</label>
        <input type="text" id="refdoctor" name="refdoctor" class="form-control form-control-sm" readonly>
    </div>
    

    <div class="col-md-3">
        
              <label>Case Type:</label>
              <select id="casetype" name="casetype" class="form-select form-select-sm" required>
                <option value="">-- Select --</option>
                {% for c in case_types %}<option>{{ c.casetype }}</option>{% endfor %}
              </select>
            </div>
            <div class="col-md-3">
              <label>PRO:</label>
              <select id="pro" name="pro" class="form-select form-select-sm" required>
                <option value="">-- Select --</option>
                {% for p in pro_list %}<option>{{ p.pro_name }}</option>{% endfor %}
              </select>
            </div>
             <div class="col-md-5 position-relative">
    <label>Doctor:</label>
    <input type="text" id="doctor" name="doctor"
           class="form-control form-control-sm" autocomplete="off">

    <!-- Suggestion box stays INSIDE same relative container -->
    <ul id="doctor-suggestions" class="suggestion-list list-group"></ul>
</div>
           
</div>



        </form> <!-- ✅ CLOSE 6 -->

      </div> <!-- ✅ CLOSE 5 -->
    </div> <!-- ✅ CLOSE 4 -->

  </div> <!-- ✅ CLOSE 2 -->

</div> <!-- ✅ CLOSE 1 -->


<!-- ✅ Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('getBtn').addEventListener('click', async () => {
        
});
document.addEventListener("DOMContentLoaded", function() {
  // Auto-fill today's date if empty
  const dateInput = document.getElementById("date");
  if (dateInput && !dateInput.value) {
    dateInput.value = new Date().toISOString().split("T")[0];
  }

  // Single click handler - get the selected date and redirect
  const getBtn = document.getElementById("getBtn");
  if (getBtn) {
    getBtn.addEventListener("click", function () {
      const selectedDate = document.getElementById("date").value; // <-- defined here
      if (!selectedDate) {
        alert("Please select a date.");
        return;
      }
      // Use URLSearchParams to encode safely
      const params = new URLSearchParams({
        return: "ipregistration",
        date: selectedDate
      });
      window.location.href = `/search-uhid?${params.toString()}`;
    });
  }
});
document.addEventListener("DOMContentLoaded", function() {
    // Auto fill today's date
    document.getElementById("date").value = new Date().toISOString().split("T")[0];

    {% if patient %}
        document.getElementById("uhid").value = "{{ patient.uhid }}";
        document.getElementById("patname").value = "{{ patient.patname }}";
        document.getElementById("age").value = "{{ patient.age }}";
        document.getElementById("agetype").value = "{{ patient.agetype }}";
        document.getElementById("gender").value = "{{ patient.gender }}";
        document.getElementById("address").value = "{{ patient.address }}";
        document.getElementById("relative").value = "{{ patient.fname }}";
        document.getElementById("phone").value = "{{ patient.phone }}";
        document.getElementById("refdoctor").value = "{{ patient.refdoctor }}";
        
    {% endif %}
});

const ipDoctorInput = document.getElementById("doctor");
const ipSuggestionBox = document.getElementById("doctor-suggestions");

// Doctor Live Search (NO fee logic)
ipDoctorInput.addEventListener("input", async function () {
    const q = this.value.trim();

    if (q.length < 1) {
        ipSuggestionBox.style.display = "none";
        return;
    }

    // IMPORTANT — Updated correct URL
    const res = await fetch(`/search-doctors1/?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    const results = data.results || [];

    ipSuggestionBox.innerHTML = "";

    if (results.length === 0) {
        ipSuggestionBox.style.display = "none";
        return;
    }

    results.forEach(doc => {
        const li = document.createElement("li");
        li.className = "list-group-item list-group-item-action py-1 px-2";
        li.textContent = doc.name;

        li.addEventListener("click", () => {
            ipDoctorInput.value = doc.name;
            ipSuggestionBox.style.display = "none";
        });

        ipSuggestionBox.appendChild(li);
    });

    ipSuggestionBox.style.display = "block";
});

// Hide on clicking outside
document.addEventListener("click", (e) => {
    if (!ipDoctorInput.contains(e.target) && !ipSuggestionBox.contains(e.target)) {
        ipSuggestionBox.style.display = "none";
    }
});
</script>

<style>
.suggestion-list {
     display:none; 
     max-height:150px;
      overflow-y:auto;
       z-index:1200;
        background:white; 
        top:calc(100% + .35rem); 
        border-radius:0 .4rem .4rem .4rem;
         box-shadow:0 6px 20px rgba(0,0,0,0.08); 
        }

.col-md-5,
.form-card,
.row,
.container-fluid {
    overflow: visible !important;
}

</style>

{% endblock %}
