<!-- Replace the preview window HTML/CSS that your JS writes with this -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Prescription Preview</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    /* Important: set A4 and remove body padding so printed content fits exactly */
    @page { size: A4 portrait; margin: 10mm; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body { display:flex; align-items:flex-start; justify-content:center; background:#fff; }

    /* Force the image to print as single A4 page */
    .preview-img {
      display:block;
      width: 190mm;           /* A4 width (210mm) minus 2*10mm page margin */
      height: auto;
      box-shadow: none;
      border: 0;
      page-break-inside: avoid;
      -webkit-print-color-adjust: exact;
    }

    /* Ensure transcription box won't break across pages */
    .no-break { page-break-inside: avoid; -webkit-region-break-inside: avoid; }

    /* hide anything not needed while printing */
    @media print {
      body { margin: 0; }
      .preview-img { width: 190mm; height:auto; }
    }
  </style>
</head>
<body>
  <img class="preview-img" src="__DATA_URL__" alt="Prescription preview">
</body>
</html>
