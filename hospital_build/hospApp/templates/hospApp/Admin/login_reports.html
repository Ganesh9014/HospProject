<!DOCTYPE html>
<html>
<head>
    <title>Login Report</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
            font-size: 14px;
        }

        .report-container {
            width: 95%;
            margin: 10px auto;
        }

        /* HEADER */
        .report-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
            padding: 8px 0;
        }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            border-bottom: 2px solid #000;
            padding: 6px;
            text-align: left;
        }

        tbody td {
            padding: 6px;
            vertical-align: top;
        }

        /* ROW NUMBER */
        .center {
            text-align: center;
        }

        /* SMALL TEXT */
        .small {
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="report-container">

    <!-- HEADER -->
    <div class="report-header">
        <div>Users Login Information</div>
        <div>
            From {{ today }} To {{ today }}
        </div>
    </div>

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>S.No</th>
               
                <th>User Name</th>
                
                
                <th>Login Time</th>
            </tr>
        </thead>

        <tbody>
{% for row in data %}
<tr>
    <td>{{ forloop.counter }}</td>

    <td>{{ row.name|upper }}</td>

    <td class="small">
        {{ row.logintime|date:"Y-m-d" }}
        {{ row.logintime|time:"H:i:s" }}
    </td>
</tr>

{% empty %}
<tr>
    <td colspan="3" class="center">
        No records found
    </td>
</tr>
{% endfor %}
</tbody>
    </table>

</div>

</body>
</html>
