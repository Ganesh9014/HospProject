<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title></title>
    <script>
        (function(){
            // 1. Notify patient list tab
            try {
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({
                        type: 'prescription_saved',
                        consult_id: "{{ consult_id }}"
                    }, "*");
                }
            } catch (e) {}

            // 2. Immediately open print page
            var printUrl = "{% url 'print_prescription' prescription.id %}";
            try {
                window.open(printUrl, '_blank');
            } catch(e) {}

            // 3. Immediately close this saving tab
            setTimeout(function(){
                window.close();
            }, 50); // quick, user never sees it
        })();
    </script>
    <style>
        body { display:none; }
    </style>
</head>
<body></body>
</html>
