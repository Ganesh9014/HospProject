{% extends 'hospApp/home.html' %}
{% load static %}
{% block content %}

<div class="container-fluid">
  <div class="card form-card">
    <div class="form-header py-2">
      <h6 class="mb-0">Refund Payment</h6>
    </div>

    <div class="card-body">
     <form method="post" action="{% url 'save_refund' %}" id="OpPaymentForm">

        {% csrf_token %}

        <!-- Row 1 -->
        <fieldset class="custom-fieldset mb-1">
  
  <legend class="float-none w-auto px-1 fs-6 fw-bold">Patient Information</legend>

  <div class="row mb-1">
          <div class="col-md-4" style="display: none;">
            <div class="d-flex align-items-center">
              <label class="form-label col-4">Patient Type</label>
              <select name="pattype" id="pattype"
                      class="form-select form-select-sm">
                <option selected>OP</option>
                <option>Others</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Row 2 -->
        <div class="row mb-1">

  <div class="col-md-4">
    <div class="d-flex align-items-center">
      <label class="form-label col-4">Towards</label>
      <select name="Towards" id="Towards"
              class="form-select form-select-sm" required>
        <option>--Select--</option>
        <option>Investigation</option>
      </select>

      <button type="button"
              id="getBtn"
              class="btn btn-primary btn-sm">
        Get
      </button>
    </div>
  </div>

  <div class="col-md-4">
    <div class="d-flex align-items-center gap-1">
      <label class="form-label col-4 mb-0">UHID</label>
      <input type="text"
             id="uhid"
             name="uhid"
             class="form-control form-control-sm"
             value="{{ patient.uhid|default:'' }}"
             required
             autocomplete="off">
    </div>
  </div>

  <div class="col-md-4">
    <div class="d-flex align-items-center">
      <label class="form-label col-4">Enter Bill No</label>
      <input type="text"
             id="billno"
             name="billno"
             class="form-control form-control-sm"
             placeholder="Enter Bill No">
    </div>
  </div>

</div>

        <!-- Row 3 -->
        <div class="row mb-1">
          <div class="col-md-4">
            <div class="d-flex align-items-center">
              <label class="form-label col-4">Patient Name</label>
              <input type="text" id="patname" name="patname"
                     class="form-control form-control-sm"
                     value="{{ patient.title }} {{ patient.patname }}"
                     readonly>
            </div>
          </div>
          <div class="col-md-4">
  <div class="d-flex align-items-center">
    
    <label class="form-label col-4 mb-0">Age</label>

    <input type="text" id="age"
           class="form-control form-control-sm me-1"
           value="{{ patient.age|default:'' }}" name="age"
           readonly>

    <select class="form-select form-select-sm me-1" disabled >
      <option>{{ patient.agetype }}</option>
    </select>

    <input type="hidden" name="agetype"
           value="{{ patient.agetype }}">

    <!-- Gender -->
    <input type="text" id="gender"
           class="form-control form-control-sm"
           value="{{ patient.gender|default:'' }}" name="gender"
           readonly>
  </div>
</div>

          <div class="col-md-4">
            <div class="d-flex align-items-center">
              <label class="form-label col-4">Phone No.</label>
              <input type="text" id="phone"
                     class="form-control form-control-sm"
                     value="{{ patient.phone|default:'' }}" name="phone"
                     readonly>
            </div>
          </div>

          <div class="col-md-4" style="display: none;">
            <div class="d-flex align-items-center" >
              <label class="form-label col-4">OP Number</label>
              <input type="text" id="opnumber"
                     class="form-control form-control-sm"
                     value="{{ patient.patid|default:'' }}"
                     readonly>
            </div>
          </div>
        </div>

        <!-- Row 4 -->
        <div class="row mb-1">
          <div class="col-md-4" style="display: none;">
            <div class="d-flex align-items-center">
              <label class="form-label col-4">Address</label>
              <input type="text" id="address"
                     class="form-control form-control-sm"
                     value="{{ patient.address|default:'' }}" name="address"
                     readonly>
            </div>
          </div>
        </div>

</fieldset>

<!-- ===== BILL DETAILS TABLE ===== -->
<fieldset class="custom-fieldset mt-2">
  <legend class="float-none w-auto px-1 fs-6 fw-bold">Bill Details</legend>

  <div class="table-responsive">
    <table class="table table-bordered table-sm text-center" id="dueBillsTable">
      <thead class="table-light">
        <tr>
          <th>Bill No</th>
          <th>Created Dt</th>
          <th>Total Amt</th>
          <th>Paid Amt</th>
          <th>Prev. Conc</th>
          <th>Balance</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="6">No Data</td>
        </tr>
      </tbody>
    </table>
  </div>
</fieldset>


<!-- ===== PAYMENT INFORMATION ===== -->
<fieldset class="custom-fieldset mt-2">
  <legend class="float-none w-auto px-1 fs-6 fw-bold">Payment Information</legend>

  <div class="row mb-1">

    <!-- Prev Paid: always shows original paid, set once on row click, never changes -->
    <div class="col-md-3">
      <div class="d-flex align-items-center">
        <label class="form-label col-5">Prev Paid</label>
        <input type="text" id="prev_paid" name="prev_paid"
               class="form-control form-control-sm"
               value="0" readonly>
      </div>
    </div>

    <!-- Concession Amt: visible only for Investigation -->
    <div class="col-md-3" id="concessionAmtCol" style="display:none;">
      <div class="d-flex align-items-center">
        <label class="form-label col-5">Con Amt</label>
        <input type="text" id="concession_display" name="concession_display"
               class="form-control form-control-sm"
               value="0" readonly
               style="background-color: #fffbe6; border-color: #f59e0b;">
      </div>
    </div>

    <!-- Refund Amount -->
    <div class="col-md-3">
      <div class="d-flex align-items-center">
        <label class="form-label col-5">Refund Amt</label>
        <input type="number" name="pay_amount"
               class="form-control form-control-sm"
               value="0" readonly>
      </div>
    </div>

    <!-- ✅ Balance: paid - refund -->
    <div class="col-md-3">
      <div class="d-flex align-items-center">
        <label class="form-label col-5">Balance</label>
        <input type="number" id="refund_balance" name="refund_balance"
               class="form-control form-control-sm"
               value="0" readonly
               style="background-color: #f0fdf4; border-color: #22c55e;">
      </div>
    </div>

    <!-- Due Amount (hidden from layout but kept for backend) -->
    <input type="hidden" name="dueamt" value="0">

  </div>
</fieldset>


<!-- ===== BILL ITEM DETAILS ===== -->
<fieldset class="custom-fieldset mt-2">
  <legend class="float-none w-auto px-1 fs-6 fw-bold">
    Bill Item Details
  </legend>

  <div class="table-responsive">
    <table class="table table-bordered table-sm text-center" id="billItemsTable">
      <thead class="table-light">
        <tr>
          <th><input type="checkbox" id="selectAllItems"></th>
          <th>S.No</th>
          <th>Item Name</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="4">No Data</td>
        </tr>
      </tbody>
    </table>
  </div>
</fieldset>


        <!-- Bottom -->
        <div class="row align-items-center mt-2">
          <div class="col-md-2">
            <input type="password" id="usercode"
                   name="usercode"
                   class="form-control form-control-sm"
                   style="background-color: yellow;"
                   placeholder="Enter User Code"
                   required>
          </div>

          <div class="col-md-6 text-center">
            <button type="submit"
                    class="btn btn-success btn-sm me-2">
              💾 Save
            </button>
            <button type="button"
                    class="btn btn-secondary btn-sm"
                    id="cancelBtn">
              Cancel
            </button>
          </div>

          <div class="col-md-6"></div>
        </div>

      </form>
    </div>
  </div>
</div>


<!-- Styles -->
<style>
.form-label {
  font-size: .78rem;
  font-weight: 600;
  color: #1f2937;
  margin-bottom: 0;
}

.form-control, .form-select {
  padding: .4rem .5rem;
  border-radius: .45rem;
  border: 1px solid black;
  font-size: .68rem;
}

.form-control:focus, .form-select:focus {
  border-color: blue;
  background-color: #ffffff;
}

input[readonly], textarea[readonly] {
  caret-color: transparent !important;
  background-color: #f3f6fb;
  color: #6b7280;
}
.custom-fieldset {
  border: 1px solid #9ca3af;
  border-radius: .5rem;
  padding: 0rem 1rem ;
}

.custom-legend {
  font-size: .8rem;
  font-weight: 700;
  padding: 0 .5rem;
  color: #111827;
}
.card-body {
  padding: 0rem 1rem;
}
</style>
<style>
.table-active {
  --bs-table-bg-state: #1dc01dff;
  
}
#dueBillsTable tbody tr:hover {
  cursor: pointer;
}
</style>


<script>
/* ---------- Helpers ---------- */
function formatDateTime(d) {
  if (!d) return "";
  return new Date(d).toLocaleString("en-IN");
}

/* ---------- Get UHID ---------- */
document.getElementById("getBtn").onclick = () => {
    const towards = document.getElementById("Towards").value;

    if (!towards || towards === "--Select--") {
        alert("❗ Please select Towards before searching");
        document.getElementById("Towards").focus();
        return;
    }

    window.location.href =
        `/search-uhid/?return=Refund&towards=${encodeURIComponent(towards)}`;
};

/* ---------- Show/Hide Concession field based on Towards ---------- */
function toggleInvestigationFields(towards) {
  const concCol = document.getElementById("concessionAmtCol");
  if (towards === "Investigation") {
    concCol.style.display = "";
  } else {
    concCol.style.display = "none";
    document.getElementById("concession_display").value = "0";
  }
}

/* ---------- Load Due Bills ---------- */
function loadDueBills(towards, uhid, billno = null) {
  const tbody = document.querySelector("#dueBillsTable tbody");
  tbody.innerHTML = `<tr><td colspan="6">Loading...</td></tr>`;

  let url = `/ajax/get-refund-bills/?uhid=${uhid}&towards=${towards}`;
  if (billno) url += `&billno=${billno}`;

  fetch(url)
    .then(r => r.json())
    .then(data => {
      tbody.innerHTML = "";

      if (!data.bills.length) {
        tbody.innerHTML = `<tr><td colspan="6">No Due Bills</td></tr>`;
        return;
      }

      data.bills.forEach(b => {
        tbody.innerHTML += `
          <tr class="due-row"
    data-billno="${b.billno}"
    data-total="${b.total}"
    data-paid="${b.paid}"
    data-original-paid="${b.original_paid}"
    data-conc="${b.concession}"
    data-balance="${b.balance}"
    data-refunded="${b.refunded}"
    data-active-total="${b.active_total}">
            <td>${b.billno}</td>
            <td>${formatDateTime(b.created)}</td>
            <td>${b.total}</td>
            <td>${b.original_paid}</td>
            <td>${b.concession}</td>
            <td><b>${b.balance}</b></td>
          </tr>`;
      });

      if (billno) setTimeout(() => autoSelectBill(billno), 100);
    });
}

/* ---------- Towards Change ---------- */
document.getElementById("Towards").addEventListener("change", function () {
  const uhid = document.getElementById("uhid").value;
  toggleInvestigationFields(this.value);
  if (!this.value || !uhid) return;
  document.getElementById("billno").value = "";
  loadDueBills(this.value, uhid);
});

/* ---------- Row Click ---------- */
document.addEventListener("click", function (e) {
  const row = e.target.closest(".due-row");
  if (!row) return;

  document.querySelectorAll(".due-row")
    .forEach(r => r.classList.remove("table-active"));

  row.classList.add("table-active");

  document.getElementById("billno").value = row.dataset.billno;

  // ✅ Set prev_paid ONCE here from original_paid — never touched again
  document.getElementById("prev_paid").value = row.dataset.originalPaid;

  // Reset payment fields
  document.querySelector('[name="pay_amount"]').value = "0";
  document.getElementById("refund_balance").value     = "0";
  document.querySelector('[name="dueamt"]').value      = row.dataset.balance;

  // Reset concession display
  document.getElementById("concession_display").value = "0";

  // Reset checkboxes
  document.querySelectorAll(".bill-item-checkbox").forEach(cb => cb.checked = false);
  document.getElementById("selectAllItems").checked = false;

  const towards = document.getElementById("Towards").value;
  loadBillItems(row.dataset.billno, towards);
});

/* ---------- On Page Load (from URL params) ---------- */
window.addEventListener('DOMContentLoaded', function () {
    const urlParams = new URLSearchParams(window.location.search);
    const uhid    = urlParams.get('uhid');
    const towards = urlParams.get('towards');

    if (window.location.search) {
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    if (uhid && towards) {
        document.getElementById("uhid").value    = uhid;
        document.getElementById("Towards").value = towards;
        toggleInvestigationFields(towards);
        loadDueBills(towards, uhid);
    }
});

/* ---------- Bill No Blur ---------- */
document.getElementById("billno").addEventListener("blur", function () {
  const billno = this.value.trim();
  if (!billno) return;

  fetch(`/ajax/get-bill-type/?billno=${billno}`)
    .then(r => r.json())
    .then(data => {
      if (!data.success) {
        alert("❌ Invalid Bill Number");
        window.location.reload();
        return;
      }

      const allowedTypes = ["CONSULTATION", "INVESTIGATION", "PROCEDURE"];
      if (!allowedTypes.includes(data.bill_type)) {
        alert("❌ This Bill Number not valid");
        window.location.reload();
        return;
      }

      document.getElementById("uhid").value = data.uhid;

      fetch(`/ajax/get-patient-by-uhid/?uhid=${data.uhid}`)
        .then(r => r.json())
        .then(pdata => {
          if (!pdata.success) {
            alert("❌ Patient not found for this Bill");
            return;
          }

          const p = pdata.patient;
          document.getElementById("patname").value = p.name;
          document.getElementById("age").value     = p.age;
          document.getElementById("gender").value  = p.gender;
          document.getElementById("phone").value   = p.phone;

          let towards = "";
          if (data.bill_type === "CONSULTATION") towards = "Consultation";
          if (data.bill_type === "INVESTIGATION") towards = "Investigation";
          if (data.bill_type === "PROCEDURE")     towards = "Procedures";

          document.getElementById("Towards").value = towards;
          toggleInvestigationFields(towards);
          loadDueBills(towards, data.uhid, billno);
        });
    });
});

/* ---------- Auto Select ---------- */
function autoSelectBill(billno) {
  document.querySelectorAll(".due-row").forEach(r => {
    if (r.dataset.billno === billno) r.click();
  });
}

/* ---------- UHID Blur ---------- */
document.getElementById("uhid").addEventListener("blur", function () {
  const uhid = this.value.trim();
  if (!uhid) return;

  fetch(`/ajax/get-patient-by-uhid/?uhid=${uhid}`)
    .then(res => res.json())
    .then(data => {
      if (!data.success) {
        alert("❌ Invalid UHID");
        document.getElementById("uhid").value    = "";
        document.getElementById("patname").value = "";
        document.getElementById("age").value     = "";
        document.getElementById("gender").value  = "";
        document.getElementById("phone").value   = "";
        document.getElementById("Towards").value = "";
        document.getElementById("billno").value  = "";
        document.querySelector("#dueBillsTable tbody").innerHTML =
          `<tr><td colspan="6">No Data</td></tr>`;
        this.focus();
        return;
      }

      const p = data.patient;
      document.getElementById("uhid").value    = p.uhid;
      document.getElementById("patname").value = p.name;
      document.getElementById("age").value     = p.age;
      document.getElementById("gender").value  = p.gender;
      document.getElementById("phone").value   = p.phone;
    })
    .catch(() => {
      alert("❌ Server error while validating UHID");
    });
});
</script>

<script>
/* ============================
   FORM SUBMIT
============================ */
document.addEventListener("DOMContentLoaded", function () {
  const form = document.getElementById("OpPaymentForm");
  if (!form) return;

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    const selectedItems = [];
    document.querySelectorAll(".bill-item-checkbox:checked").forEach(cb => {
      selectedItems.push({
        id:   cb.dataset.itemId,
        type: cb.dataset.itemType
      });
    });

    if (selectedItems.length === 0) {
      alert("❗ Please select at least one item");
      return;
    }

    const refundAmt = parseFloat(document.querySelector('[name="pay_amount"]').value || 0);
    if (refundAmt <= 0) {
      alert("❗ Refund Amount must be greater than 0");
      return;
    }

    const formData = new FormData(this);
    formData.append("selected_items", JSON.stringify(selectedItems));

    fetch(this.action, {
      method: "POST",
      headers: {
        "X-CSRFToken": document.querySelector('[name="csrfmiddlewaretoken"]').value
      },
      body: formData
    })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
  alert("✅ Refund saved successfully");
  window.location.href = "/Refunds/";  // your exact refund URL
} else {
        alert(res.message || "❌ Refund failed");
      }
    });
  });
});
</script>

<script>
/* ============================
   LOAD BILL ITEMS
============================ */
function loadBillItems(billno, towards) {
  const tbody = document.querySelector("#billItemsTable tbody");
  tbody.innerHTML = `<tr><td colspan="4">Loading...</td></tr>`;

  fetch(`/ajax/get-bill-items/?billno=${billno}&towards=${towards}`)
    .then(r => r.json())
    .then(data => {
      tbody.innerHTML = "";

      if (!data.items.length) {
        tbody.innerHTML = `<tr><td colspan="4">No Items</td></tr>`;
        return;
      }

      data.items.forEach((item, idx) => {
        const isInactive = item.active === "N";
        tbody.innerHTML += `
          <tr ${isInactive ? 'style="opacity:0.5; background:#f3f4f6;"' : ''}>
            <td>
              <input type="checkbox"
                     class="bill-item-checkbox"
                     data-amount="${item.amount}"
                     data-item-id="${item.id}"
                     data-item-type="${towards}"
                     
                     ${isInactive ? 'disabled title="Already refunded"' : ''}>
            </td>
            <td>${idx + 1}</td>
            <td>
              ${item.name}
              ${isInactive ? ' <span style="color:#dc2626;font-size:.7rem;font-weight:700;">[Refunded]</span>' : ''}
            </td>
            <td>${item.amount}</td>
          </tr>
        `;
      });
    });
}
</script>

<script>
/* ============================
   CHECKBOX LOGIC
============================ */
document.addEventListener("change", function (e) {

  if (e.target.id === "selectAllItems") {
    document.querySelectorAll(".bill-item-checkbox").forEach(cb => {
      if (!cb.disabled) cb.checked = e.target.checked;
    });
    updateSelectedItemTotal(e.target);
  }

  if (e.target.classList.contains("bill-item-checkbox")) {
    const all     = document.querySelectorAll(".bill-item-checkbox:not([disabled])");
    const checked = document.querySelectorAll(".bill-item-checkbox:checked");
    document.getElementById("selectAllItems").checked =
      all.length > 0 && all.length === checked.length;

    updateSelectedItemTotal(e.target);
  }
});


function updateSelectedItemTotal(changedCheckbox = null) {
  const towards   = document.getElementById("Towards").value;
  const activeRow = document.querySelector("#dueBillsTable tbody tr.table-active");

  if (!activeRow) return;

  if (towards === "Investigation") {

    const billTotal      = parseFloat(activeRow.dataset.total       || 0);  // original total (for concession %)
const activeTotal    = parseFloat(activeRow.dataset.activeTotal || 0);  // remaining items only
const billPaid       = parseFloat(activeRow.dataset.paid        || 0);  // net paid after all prior refunds
const billConcession = parseFloat(activeRow.dataset.conc        || 0);

    let selectedTotal = 0;
    document.querySelectorAll(".bill-item-checkbox:checked").forEach(cb => {
      selectedTotal += parseFloat(cb.dataset.amount || 0);
    });

    // Proportional concession on selected items
    const concessionPct        = billTotal > 0 ? (billConcession / billTotal) : 0;
    const calculatedConcession = selectedTotal * concessionPct;
    let   refundAmount         = selectedTotal - calculatedConcession;

    // ✅ Show calculated concession
    document.getElementById("concession_display").value = calculatedConcession.toFixed(2);

    // ✅ Cap refund at proportional share of NET paid (already excludes prior refunds)
    // ✅ Use activeTotal as denominator — only remaining items count
const proportionalPaid = activeTotal > 0 ? billPaid * (selectedTotal / activeTotal) : 0;
    refundAmount = Math.min(refundAmount, proportionalPaid);

    document.querySelector('[name="pay_amount"]').value  = refundAmount.toFixed(2);

    // ✅ Balance = net paid - refund amount (money remaining after this refund)
    document.getElementById("refund_balance").value      = (billPaid - refundAmount).toFixed(2);

    // due amt stays as bill's running balance
    document.querySelector('[name="dueamt"]').value      = activeRow.dataset.balance;

    // NOTE: prev_paid is NOT touched here — it was set on row click and stays fixed

  } else {
    // Consultation / Procedures
    document.getElementById("concession_display").value = "0";

    const prevPaid = parseFloat(document.getElementById("prev_paid").value || 0);

    let total = 0;
    document.querySelectorAll(".bill-item-checkbox:checked").forEach(cb => {
      total += parseFloat(cb.dataset.amount || 0);
    });

    if (total > prevPaid) {
      alert("❌ Refund Amount cannot exceed Prev Paid amount");
      if (changedCheckbox) changedCheckbox.checked = false;

      const all     = document.querySelectorAll(".bill-item-checkbox:not([disabled])");
      const checked = document.querySelectorAll(".bill-item-checkbox:checked");
      document.getElementById("selectAllItems").checked =
        all.length > 0 && all.length === checked.length;

      return;
    }

    document.querySelector('[name="pay_amount"]').value  = total.toFixed(2);
    document.getElementById("refund_balance").value      = (prevPaid - total).toFixed(2);
    document.querySelector('[name="dueamt"]').value      = (prevPaid - total).toFixed(2);

    // NOTE: prev_paid is NOT touched here either
  }
}
document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("uhid").focus();
});
</script>

{% endblock %}
